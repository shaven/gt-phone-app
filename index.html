<style>

<body>
<div id="app" hidden>
  <header id="top">
    <button id="b-sessions" class="icon" type="button" aria-label="Sessions">&#9776;</button>
    <div id="title-box"><div id="title">gt phone</div><div id="chips" class="chips"></div></div>
    <button id="b-settings" class="icon" type="button" aria-label="Settings">&#8943;</button>
  </header>
  <div id="conn" role="status"></div>
  <div id="viewing" hidden></div>
  <main id="scroll">
    <div id="ptr" aria-hidden="true"></div>
    <div id="log" role="log" aria-label="Conversation" aria-live="off"></div>
    <div id="outbox"></div>
    <div id="cards" aria-label="Approval requests"></div>
  </main>
  <button id="jump" type="button" hidden aria-label="Jump to the newest message">&#8595;</button>
  <div id="activity" role="status"></div>
  <div id="sugg" class="sugg" aria-label="Suggested prompts"></div>
  <div id="composer">
    <textarea id="input" rows="1" maxlength="8000" aria-label="Message Claude" placeholder="Message Claude"></textarea>
    <button id="send" class="primary" type="button" aria-label="Send">&#8593;</button>
  </div>
  <div id="note" role="status"></div>
</div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet-head"><h2 id="sheet-title"></h2><button id="sheet-close" class="icon" type="button" aria-label="Close">&#10005;</button></div>
  <div id="sheet-body"></div>
</div>
<section id="pairing" class="page" hidden>
  <h2>Pair with your Mac</h2>
  <p class="muted" id="pair-repo"></p>
  <label for="pair-name">Name for this phone</label>
  <input id="pair-name" maxlength="32" value="iPhone" autocomplete="off">
  <label for="pair-token">GitHub token (fine-grained, contents read and write on that one repository)</label>
  <input id="pair-token" type="password" autocomplete="off" spellcheck="false">
  <p><button id="pair-go" class="primary" type="button">Pair</button></p>
  <div id="pair-code-box" hidden>
    <p>Type this code at the Mac:</p>
    <div class="code6" id="pair-code"></div>
  </div>
  <p class="muted" id="pair-msg"></p>
</section>
<section id="unpaired" class="page" hidden>
  <h2>gt phone</h2>
  <p>Not paired. At the home Mac run <code>gt_phone_relay.py pair</code> (or Pair a phone in the gt console) and
  scan the code it shows with this phone's camera.</p>
  <p class="muted" id="unpaired-why"></p>
</section>
<div id="announce" class="sr" aria-live="assertive"></div>
<script>
"use strict";
/* gt-phone-crypto:begin -- pure functions, also run by the Mac's interop test under node */
const FORMAT = "gt-phone/1";
const enc = new TextEncoder(), dec = new TextDecoder();
function b64u(bytes) {
  let s = ""; const b = new Uint8Array(bytes);
  for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function unb64u(text) {
  if (typeof text !== "string" || !/^[A-Za-z0-9_-]*$/.test(text)) throw new Error("not base64url");
  const s = atob(text.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((text.length + 3) % 4));
  const out = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
  return out;
}
function hex(bytes) { return Array.from(bytes, b => b.toString(16).padStart(2, "0")).join(""); }
function aad(direction, pair, path) { return enc.encode(FORMAT + "|" + direction + "|" + pair + "|" + path); }
async function seal(key, direction, pair, path, plain) {
  const n = crypto.getRandomValues(new Uint8Array(12));
  const c = await crypto.subtle.encrypt({ name: "AES-GCM", iv: n, additionalData: aad(direction, pair, path) }, key, plain);
  return enc.encode(JSON.stringify({ c: b64u(c), n: b64u(n), p: pair, v: FORMAT }));
}
async function unseal(key, direction, pair, path, raw) {
  const doc = JSON.parse(dec.decode(raw));
  if (!doc || doc.v !== FORMAT || doc.p !== pair) throw new Error("not a sealed file for this pairing");
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64u(doc.n), additionalData: aad(direction, pair, path) },
                                            key, unb64u(doc.c));
  return new Uint8Array(plain);
}
async function signBody(priv, body) {
  const sig = await crypto.subtle.sign({ name: "ECDSA", hash: "SHA-256" }, priv, enc.encode(body));
  return JSON.stringify({ body: body, sig: b64u(sig) });
}
async function makeRequest(K, priv, pair, type, fields, nowMs) {
  const id = hex(crypto.getRandomValues(new Uint8Array(16)));
  const ts = Math.floor(nowMs / 1000);
  const body = JSON.stringify(Object.assign({ v: 1, type: type, id: id, pair: pair, ts: ts, exp: ts + 240 }, fields));
  const path = "phone/in/" + id + ".json";
  return { id: id, path: path, bytes: await seal(K, "p2m", pair, path, enc.encode(await signBody(priv, body))) };
}
async function makePairRequest(K, keyPair, pair, name, nowMs) {
  const pub = new Uint8Array(await crypto.subtle.exportKey("raw", keyPair.publicKey));
  const ts = Math.floor(nowMs / 1000);
  const body = JSON.stringify({ v: 1, type: "pair", id: hex(crypto.getRandomValues(new Uint8Array(16))), pair: pair,
                                pub: b64u(pub), name: name, ts: ts, exp: ts + 240 });
  const path = "phone/in/pair-" + pair + ".json";
  return { path: path, pub: pub, bytes: await seal(K, "p2m", pair, path, enc.encode(await signBody(keyPair.privateKey, body))) };
}
async function confirmCode(rawK, pair, pub) {
  const hk = await crypto.subtle.importKey("raw", rawK, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
  const msg = new Uint8Array([...enc.encode("gt-phone/1 confirm|" + pair + "|"), ...pub]);
  const d = new Uint8Array(await crypto.subtle.sign("HMAC", hk, msg));
  const n = ((d[0] << 24) >>> 0) + (d[1] << 16) + (d[2] << 8) + d[3];
  return String(n % 1000000).padStart(6, "0");
}
/* gt-phone-crypto:end */

/* gtcon-copy:begin -- the gt console's own view levels, event words, activity line, mode and model chips
   (golden-thread/<version>/templates/ui/claude.html, GTCON), copied verbatim; tests/test_gt_phone_page.py checks */
var GTCON = (function () {
  var LEVELS = ["minimal", "simple", "answers", "steps", "everything"];
  function plainLevel(level) { return level === "simple" || level === "minimal"; }
  var LEVEL_SHOWS = { minimal: { thinking: false, steps: false, system: false, narration: false, decisions: false, stamps: false },
                      simple: { thinking: false, steps: false, system: false, narration: false, decisions: false, stamps: false },
                      answers: { thinking: false, steps: false, system: false, narration: true, decisions: true, stamps: true },
                      steps: { thinking: false, steps: true, system: false, narration: true, decisions: true, stamps: true },
                      everything: { thinking: true, steps: true, system: true, narration: true, decisions: true, stamps: true } };
  var CAT_TOGGLE = { thinking: "thinking", step: "steps", system: "system" };
  function viewFor(level, show) {
    if (!LEVEL_SHOWS[level]) { level = "steps"; }
    var s = {}, base = LEVEL_SHOWS[level];
    Object.keys(base).forEach(function (k) { s[k] = show && typeof show[k] === "boolean" && !plainLevel(level) ? show[k] : base[k]; });
    return { level: level, show: s };
  }
  function narration(list) {
    var out = {}, texts = [];
    (list || []).forEach(function (e) {
      if (!e) { return; }
      if (e.kind === "user") { texts = []; return; }
      if (e.kind === "assistant_text") { texts.push(e); return; }
      if (e.kind === "tool_use") { texts.forEach(function (t) { out[t.seq] = true; }); texts = []; }
    });
    return out;
  }
  var STAMP_LINE = /^[ \t]*\d{4}-\d{2}-\d{2}(?:[ T]\d{1,2}:\d{2}(?::\d{2})?)?(?:[ \t]*(?:[A-Z]{2,5}|Z|UTC[+-]\d{1,2}|[+-]\d{2}:?\d{2}))?[ \t]*(?:\r?\n|$)/;
  function stripStamp(text) {
    var t = String(text || ""), m = STAMP_LINE.exec(t);
    return m ? t.slice(m[0].length).replace(/^(?:[ \t]*\r?\n)+/, "") : t;
  }
  function plainMarks(list, open) {
    var dec = {}, last = {}, turnLast = null, turns = [];
    (list || []).forEach(function (e) {
      if (!e) { return; }
      var d = e.data || {};
      if (e.kind === "approval_decision" && typeof d.request_id === "string") { dec[d.request_id] = d.decision === "allow" ? "allow" : "deny"; }
      if (e.kind === "user" && e.cat !== "system") { turns.push(turnLast); turnLast = null; return; }
      if (e.kind === "assistant_text" && !d.partial && String(d.text || "").trim()) { turnLast = e.seq; }
      if (e.kind === "tool_use") { turnLast = null; }            // a text before a tool call is narration
    });
    turns.forEach(function (q) { if (q !== null) { last[q] = true; } });
    if (turnLast !== null && !open) { last[turnLast] = true; }
    return { dec: dec, last: last };
  }
  function visible(e, view, narr, marks) {
    if (!e || e.kind === "error") { return true; }
    var d = e.data || {}, show = (view && view.show) || {}, lv = view && view.level, dec = (marks && marks.dec) || {};
    if (e.kind === "approval_request") {
      // Simple hides the row of an allowed request; Minimal shows only a denied (or expired) one: the card is the ask
      if (lv === "simple") { return dec[d.request_id] !== "allow"; }
      if (lv === "minimal") { return dec[d.request_id] === "deny"; }
      return true;
    }
    if (e.kind === "cost" || e.cat === "cost") { return false; }
    if (e.kind === "assistant_text" && show.stamps === false && !d.partial && !stripStamp(d.text).trim() && String(d.text || "").trim()) { return false; }
    if (plainLevel(lv)) {
      var low = !e.min_level || e.min_level === "answers" || e.min_level === "simple" || e.min_level === "minimal";
      if (e.kind === "user") { return low && e.cat !== "system"; }
      if (e.kind === "assistant_text" && lv === "minimal") { return low && !d.partial && !!(marks && marks.last && marks.last[e.seq]); }
      if (e.kind === "assistant_text") { return low && !(narr && narr[e.seq]); }
      if (e.kind === "approval_decision") { return !d.auto && d.decision !== "allow"; }   // a denial is news; an Allowed is not
      return e.kind === "mode_change";

  const canSend = !viewing && last && last.session && last.session.phone_prompts;
  const hits = canSend ? PHONE.cmdMatches(PHONE.cmdList(last), $("input").value) : [];
  const list = hits.length ? hits.map(h => ({ label: h.c, prompt: h.c + " ", cmd: true, d: h.d }))
    : (canSend && prefs.sugg ? (last.suggestions || []) : []);
  box.hidden = !list.length;
  list.forEach(s => {
    const b = el("button", null, s.label); b.type = "button"; b.setAttribute("aria-label", (s.cmd ? "Command: " + s.d + " " : "Suggestion: ") + s.prompt);
    b.onclick = () => {
      if (s.cmd) { $("input").value = s.prompt; $("input").focus(); autosize(); renderSugg(); }
      else if (prefs.suggTap === "send") { $("input").value = s.prompt; sendPrompt(); }
      else { $("input").value = s.prompt; $("input").focus(); autosize(); }
    };
    box.appendChild(b);
  });
}
function renderComposer() {
  const why = PHONE.composerWhy(last, viewing), s = last && last.session, busy = s && (s.state === "running" || s.state === "waiting_approval" || s.state === "starting");
  const input = $("input"), btn = $("send");
  input.disabled = !!why;
  input.setAttribute("placeholder", why || "Message Claude (Ask mode: every tool call asks)");
  if (busy && !viewing) { btn.textContent = "■"; btn.setAttribute("aria-label", "Interrupt the running turn"); btn.disabled = false; btn.className = "danger"; }
  else { btn.textContent = "↑"; btn.setAttribute("aria-label", "Send"); btn.disabled = !!why; btn.className = "primary"; }
}
function renderAcks() {
  ((last && last.acks) || []).forEach(a => {
    const s = sent[a.id];
    if (!s) return;
    delete sent[a.id];
    if (s.type === "prompt") { const o = outbox.filter(x => x.id === a.id)[0]; if (o) { o.state = a.ok ? "delivered" : "refused"; o.why = a.message; } }
    if (s.type === "approve" || s.type === "deny") delete cardLocked[s.request_id];
    if (s.type !== "prompt" || !a.ok) say("note", PHONE.ackWords(s.type, a));
  });
}
function notifyTurn() {
  const s = last && last.session, state = s ? s.state : "";
  if (turnWas && turnWas !== "idle" && state === "idle") {
    announce("Claude answered.");
    if (prefs.haptics && navigator.vibrate) { try { navigator.vibrate([10, 40, 10]); } catch (e) {} }
    if (prefs.sound) beep();
  }
  turnWas = state;
  const busy = s && state !== "idle" && state !== "ended";
  if (prefs.awake && busy && !document.hidden && !wake && navigator.wakeLock) {
    navigator.wakeLock.request("screen").then(l => { wake = l; }, () => {});
  } else if (wake && (!busy || !prefs.awake)) { try { wake.release(); } catch (e) {} wake = null; }
}
function beep() {
  try {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    const ctx = new C(), o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = 660; g.gain.value = 0.05; o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.12);
  } catch (e) { /* no sound here */ }
}
// ---- following the bottom
let stick = true;                    // the person is at the bottom (set by their own scrolling only)
function toBottom() { const sc = $("scroll"); stick = true; sc.scrollTop = sc.scrollHeight; $("jump").hidden = true; }
function followBottom() {
  const sc = $("scroll"), d = () => sc.scrollHeight - sc.scrollTop - sc.clientHeight;
  if (prefs.autoscroll && stick) { sc.scrollTop = sc.scrollHeight; $("jump").hidden = true; }
  else { $("jump").hidden = d() < 160; }
}
function renderAll() {
  renderAcks();
  renderConn();
  renderChips();
  renderViewing();
  renderLog(currentEvents(), currentOpen());
  renderOutbox();
  renderCards();
  renderActivity();
  renderSugg();
  renderComposer();
  notifyTurn();
  followBottom();
}

// ---- the composer
function autosize() { const i = $("input"); i.style.height = "auto"; i.style.height = Math.min(i.scrollHeight, 320) + "px"; store.set("draft", i.value); }
async function sendPrompt() {
  const s = last && last.session, text = PHONE.canonical(PHONE.cmdList(last), $("input").value);
  const why = PHONE.composerWhy(last, viewing) || PHONE.promptCheck(text);
  if (why) { say("note", why); return; }
  $("input").value = ""; store.del("draft"); autosize();
  const o = { text: text, at: Date.now(), state: "sending" };
  outbox.push(o); renderOutbox(); toBottom();
  const id = await act("prompt", { session: s.id, text: text }, null);
  if (id) { o.id = id; } else { o.state = "refused"; o.why = "it could not be written to GitHub"; }
  renderOutbox();
}

// ---- sheets: sessions and settings
function openSheet(which, title) {
  sheetOpen = which;
  say("sheet-title", title);
  $("sheet").hidden = false;
  $("sheet-close").focus();
}
function closeSheet() { sheetOpen = ""; $("sheet").hidden = true; clear($("sheet-body")); $("b-" + "settings").focus(); }
function openSessions() {
  openSheet("sessions", "Sessions");
  const b = $("sheet-body"); clear(b);
  const rows = PHONE.sessions(last, prefs.ended, Date.now());
  if (!rows.length) b.appendChild(el("p", "muted", last ? "No sessions on the Mac yet: start one in the gt console." : "Waiting for the Mac…"));
  rows.forEach(r => {
    const btn = el("button", "srow" + (r.promptable ? " live" : "")); btn.type = "button";
    btn.appendChild(el("span", null, r.prompt || r.label));
    btn.appendChild(el("span", "sub", [r.promptable ? "live: prompts go here" : r.stateWord, r.model, r.live ? "started " + r.started : "ended " + (r.ended || r.started)].filter(Boolean).join(" · ")));
    btn.onclick = () => {
      closeSheet();
      if (r.promptable) { viewing = null; viewDoc = null; }
      else { viewing = r.sid; viewDoc = null; act("view", { session: r.sid }, null); }
      rowsSeen = {}; renderAll();
    };
    b.appendChild(btn);
  });
  const s = last && last.session;
  if (s) {
    b.appendChild(el("h3", null, "This session"));
    const full = el("button", "srow", "Open its full record (read only)"); full.type = "button";
    full.onclick = () => { closeSheet(); viewing = s.id; viewDoc = null; act("view", { session: s.id }, null); rowsSeen = {}; renderAll(); };
    const intr = el("button", "srow", "Interrupt the running turn"); intr.type = "button";
    intr.onclick = () => { closeSheet(); act("interrupt", { session: s.id }, null); };
    const stop = el("button", "srow danger", "Stop this session"); stop.type = "button";
    stop.onclick = () => { if (!prefs.confirmStop || confirm("Stop the session at the Mac? Its open approvals are denied.")) { closeSheet(); act("stop", { session: s.id }, null); } };
    [full, intr, stop].forEach(x => b.appendChild(x));
  }
}
const SETTINGS = [
  ["Display"],
  ["theme", "Theme", { auto: "Follow the phone", light: "Light", dark: "Dark", contrast: "High contrast" }],
  ["size", "Text size", null],
  ["density", "Spacing", { comfortable: "Comfortable", compact: "Compact" }],
  ["level", "View level", { mac: "Follow the Mac", minimal: "Minimal", simple: "Simple", answers: "Answers", steps: "Steps", everything: "Everything" },
   "Minimal: your message, one line while Claude works, then its closing question. Everything adds steps, thinking and system lines."],
  ["plain", "Plain words on approval cards", null, "“Read a file” instead of the tool's name and command (details stay one tap away)."],
  ["activity", "Show the activity line", null],
  ["modelChip", "Show the model", null],
  ["ctxChip", "Show context and weekly readings", null, "Percentages only, as the console shows them."],
  ["stamps", "Show times", null],
  ["phoneTag", "Tag messages sent from the phone", null],
  ["motion", "Motion", { auto: "Follow the phone", reduce: "Reduce" }],
  ["Behaviour"],
  ["card", "Approval card default", { mac: "Follow the Mac", allow: "Allow once", deny: "Deny" }, "Which button is highlighted. Every card still waits 0.7 s before it takes a tap."],
  ["sugg", "Suggested prompts", null],
  ["suggTap", "Tapping a suggestion", { fill: "Puts it in the box", send: "Sends it" }],
  ["enterSends", "Return sends the message", null],
  ["autoscroll", "Follow new messages", null],
  ["haptics", "Vibrate on approvals and answers", null, "Where this browser can."],
  ["sound", "Sound on approvals and answers", null],
  ["poll", "Check for news", { auto: "Adaptive (3 s busy, 5 s, then 15 s)", "3": "Every 3 s", "5": "Every 5 s", "10": "Every 10 s", "30": "Every 30 s" }, "Slower uses fewer GitHub requests."],
  ["awake", "Keep the screen on while Claude works", null],
  ["ended", "List ended sessions", null],
  ["confirmStop", "Ask before stopping a session", null]
];
function control(key, label, opts, help) {
  const row = el("div", "set"), lab = el("label", null, label), id = "set-" + key;
  lab.setAttribute("for", id);
  if (help) lab.appendChild(el("span", "help", help));
  row.appendChild(lab);
  let c;
  if (key === "size" || opts) {
    c = el("select");
    const choices = key === "size" ? PHONE.SIZES.map(n => [String(n), n + " pt"]) : Object.keys(opts).map(k => [k, opts[k]]);
    choices.forEach(([v, t]) => { const o = el("option", null, t); o.value = v; c.appendChild(o); });
    c.value = String(prefs[key]);
    c.onchange = () => { prefs[key] = key === "size" ? Number(c.value) : c.value; prefs = PHONE.cleanPrefs(prefs); savePrefs(); applyPrefs(); rowsSeen = {}; renderAll(); };
  } else {
    c = el("input"); c.type = "checkbox"; c.checked = !!prefs[key];
    c.onchange = () => { prefs[key] = !!c.checked; savePrefs(); applyPrefs(); rowsSeen = {}; renderAll(); };
  }
  c.id = id;
  row.appendChild(c);
  return row;
}
// One of the Mac's two phone-settable defaults: a signed "setting" request; the Mac checks and audits it.
function macControl(key, label, set) {
  const row = el("div", "set"), lab = el("label", null, label + " (on the Mac)"), id = "mac-" + key, c = el("select");
  lab.setAttribute("for", id);
  lab.appendChild(el("span", "help", "Changes the Mac's own default, for the console there too."));
  row.appendChild(lab);
  const opts = PHONE.MAC_SETTABLE[key];
  Object.keys(opts).forEach(v => { const o = el("option", null, opts[v]); o.value = v; c.appendChild(o); });
  c.value = PHONE.macSettingNow(key, set);
  c.onchange = () => {
    const why = PHONE.macSettingWhy(key, c.value, last && last.settings);
    if (why) { say("note", label + ": " + why); c.value = PHONE.macSettingNow(key, last && last.settings); return; }
    act("setting", { key: key, value: c.value }, null);
  };
  c.id = id;
  row.appendChild(c);
  return row;
}
function ro(label, value) { const r = el("div", "ro"); r.appendChild(el("span", null, label)); r.appendChild(el("span", null, value)); return r; }
function openSettings(refresh) {
  if (!refresh) openSheet("settings", "Settings");
  const b = $("sheet-body"); clear(b);
  SETTINGS.forEach(s => { if (s.length === 1) b.appendChild(el("h3", null, s[0])); else b.appendChild(control(s[0], s[1], s[2], s[3])); });
  const nowS = Date.now() / 1000, st = last || {}, mac = st.mac || {}, set = st.settings || {};
  b.appendChild(el("h3", null, "The Mac (read only)"));
  b.appendChild(ro("Paired Mac", mac.name || "not seen yet"));
  b.appendChild(ro("Relay", last ? "on · feed written " + PHONE.ago(nowS - st.at) : "no feed yet"));
  b.appendChild(ro("This phone seen by the Mac", st.phone_seen ? PHONE.ago(nowS - st.phone_seen) : "not yet"));
  b.appendChild(ro("Audit, last day", PHONE.auditWords(st.audit, nowS)));
  const may = (set.mac || []).filter(m => PHONE.macSettingWhy(m.key, PHONE.macSettingNow(m.key, set), set) === null);
  (set.mac || []).forEach(m => { if (may.indexOf(m) < 0) b.appendChild(ro(m.label, m.value + " · change at the Mac")); });
  if (may.length) {
    b.appendChild(el("h3", null, "The Mac's defaults this phone may change"));
    may.forEach(m => b.appendChild(macControl(m.key, m.label, set)));
  } else {
    b.appendChild(ro("Mac settings this phone may change", "none: change them at the Mac"));
  }
  b.appendChild(el("p", "muted", "Raising the mode, every other setting, pairing and the Touch ID unlock stay at the Mac."));
  b.appendChild(el("h3", null, "This phone"));
  b.appendChild(ro("Name", (cfg && cfg.name) || "phone"));
  b.appendChild(ro("Repository", cfg ? cfg.repo + " (" + cfg.branch + ")" : ""));
  b.appendChild(ro("GitHub requests left this hour", rate.left === null ? "not known yet" : String(rate.left)));
  b.appendChild(ro("Screen wake lock", navigator.wakeLock ? "available" : "not available in this browser: keep the page open"));
  const tok = el("button", "srow", "Change the GitHub token"); tok.type = "button";
  tok.onclick = () => { const t = prompt("New GitHub token (fine-grained, contents read and write on that one repository)"); if (t && t.trim()) { store.set("token", t.trim()); say("note", "Token changed."); } };
  const clr = el("button", "srow", "Clear local data (keeps the pairing)"); clr.type = "button";
  clr.onclick = () => { if (!confirm("Clear this phone's settings, draft and saved feed? The pairing stays.")) return; clearLocal(); };
  const fgt = el("button", "srow danger", "Forget this pairing"); fgt.type = "button";
  fgt.onclick = async () => { if (!confirm("Forget this pairing? Pair again at the Mac to use the phone, and forget this phone at the Mac too (gt console or gt_phone_relay.py unpair).")) return; await unpairHere(); };
  [tok, clr, fgt].forEach(x => b.appendChild(x));
}
function clearLocal() {
  ["prefs", "draft", "sealed"].forEach(k => store.del(k));
  prefs = PHONE.prefsDefaults(); applyPrefs(); etag = ""; ansOpen = {}; rowsSeen = {};
  say("note", "Local data cleared; the pairing is kept.");
  if (sheetOpen === "settings") openSettings(true);
}
async function unpairHere() {
  store.clear();
  try { await idb("readwrite", st => st.clear()); } catch (e) { /* nothing stored */ }
  K = P = cfg = last = null;
  clearTimeout(timer);
  closeSheet();
  show("unpaired"); say("unpaired-why", "This phone forgot the pairing.");
}

// ---- pull to refresh, the jump button, keys
function wire() {
  const sc = $("scroll"), ptr = $("ptr");
  let y0 = null, armed = false;
  sc.addEventListener("touchstart", e => { y0 = sc.scrollTop <= 0 && e.touches && e.touches[0] ? e.touches[0].clientY : null; armed = false; }, { passive: true });
  sc.addEventListener("touchmove", e => {
    if (y0 === null || !e.touches || !e.touches[0]) return;
    const dy = e.touches[0].clientY - y0;
    armed = dy > 64;
    ptr.className = dy > 8 ? "on" : "";
    ptr.textContent = armed ? "Release to refresh" : "Pull to refresh";
  }, { passive: true });
  sc.addEventListener("touchend", () => { if (armed) { etag = ""; rate.waitUntil = 0; kick(0); } y0 = null; armed = false; ptr.className = ""; });
  // Following the bottom is decided by the person's own scrolling, never by a layout change: the outbox, an
  // approval card, an image or the keyboard can grow the page by more than the threshold between two renders.
  sc.addEventListener("scroll", () => {
    const d = sc.scrollHeight - sc.scrollTop - sc.clientHeight;
    stick = d < 80;
    $("jump").hidden = d < 160;
  }, { passive: true });
  $("jump").onclick = () => toBottom();
  if (typeof ResizeObserver !== "undefined") {
    const ro = new ResizeObserver(() => followBottom());
    [sc, $("log"), $("outbox"), $("cards")].forEach(n => { if (n) ro.observe(n); });
  }
  $("send").onclick = () => {
    const s = last && last.session;
    if (s && !viewing && (s.state === "running" || s.state === "waiting_approval" || s.state === "starting")) act("interrupt", { session: s.id }, null);
    else sendPrompt();
  };
  $("input").addEventListener("input", () => {
    // /gt-open + a space becomes /gt:gt-open in the box, as the Claude prompt completes it
    const i = $("input"), v = i.value, v2 = /^\s*\/[a-z0-9-]+\s/.test(v) ? PHONE.canonical(PHONE.cmdList(last), v) : v;
    if (v2 !== v) { const pos = i.selectionStart + (v2.length - v.length); i.value = v2; i.setSelectionRange(pos, pos); }
    autosize(); renderSugg();
  });
  $("input").addEventListener("keydown", e => { if (prefs.enterSends && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendPrompt(); } });
  $("b-sessions").onclick = openSessions;
  $("b-settings").onclick = () => openSettings(false);
  $("sheet-close").onclick = closeSheet;
  document.addEventListener("keydown", e => { if (e.key === "Escape" && sheetOpen) closeSheet(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { hello(true); kick(0); } });
  const mq = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;
  if (mq && mq.matches && prefs.motion === "auto") document.documentElement.setAttribute("data-motion", "reduce");
}

async function main() {
  loadPrefs(); applyPrefs();
  const m = /#gt-phone=([A-Za-z0-9_-]+)$/.exec(location.hash || "");
  if (m) return startPairing(m[1]);
  try { cfg = JSON.parse(store.get("cfg") || "null"); } catch (e) { cfg = null; }
  if (cfg) { K = await idb("readonly", st => st.get("K")); P = await idb("readonly", st => st.get("P")); }
  if (!cfg || !K || !P || !REPO_RE.test(cfg.repo) || !BRANCH_RE.test(cfg.branch) || !/^[0-9a-f]{16}$/.test(cfg.pair || "") ||
      (cfg.api !== undefined && !API_RE.test(cfg.api))) { show("unpaired"); return; }
  show("app");
  wire();
  $("input").value = store.get("draft") || "";
  const cached = store.get("sealed");                 // the last feed, still sealed: opens with K or not at all
  if (cached) {
    try { const st = JSON.parse(dec.decode(await unseal(K, "m2p", cfg.pair, OUT, enc.encode(cached)))); if (PHONE.feedOk(st)) last = st; } catch (e) { store.del("sealed"); }
  }
  renderAll();
  hello(true);
  await tick();
}
main();
